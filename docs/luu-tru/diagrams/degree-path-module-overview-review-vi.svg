<text x="300" y="1530" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#526477">Khung ngoài: module. Package bên trong: nhóm chức năng. Đường liền: sự tham gia của actor.</text>
<text x="300" y="1562" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#526477">Dữ liệu trường chỉ đọc; đăng ký môn chính thức thực hiện tại cổng trường.</text>
<text x="300" y="1594" text-anchor="start" dominant-baseline="central" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#526477">Mã UC giữ theo danh mục đề xuất; các use case còn lại sẽ được trình bày ở sơ đồ chi tiết.</text>
