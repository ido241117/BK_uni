# Hạ tầng phụ cho môi trường phát triển BK Uni. CSDL chính là PostgreSQL trên Supabase (không nằm ở đây).
# Chạy các lệnh dưới trong thư mục Backend.
#
#   docker compose up -d elasticsearch          # Elasticsearch cho tìm kiếm đề cương (http://localhost:9201)
#   docker compose --profile kibana up -d       # thêm Kibana (http://localhost:5602) để xem index / Dev Tools
#   docker compose down                         # tắt (dữ liệu index giữ trong volume bkuni-es-data)
#
# Chỉ dùng cho máy phát triển: tắt bảo mật (không mật khẩu, không TLS) và chỉ mở cổng cho localhost.
name: bkuni

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: bkuni-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.name=bkuni
      # Giới hạn heap: container ES khác trên máy từng bị kill (exit 137) vì để mặc định
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    mem_limit: 1g
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - bkuni-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: bkuni-kibana
    profiles: ["kibana"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5602:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  bkuni-es-data:
