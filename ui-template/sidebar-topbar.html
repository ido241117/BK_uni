<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BK Uni – Sidebar + Topbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root {
  --bg-canvas: #FFFFFF;
  --bg-blush: #FDF4F7;
  --bg-tint-hover: #FBEDF2;

  --ink-primary: #3B2230;
  --ink-muted: #8E6B78;
  --ink-soft: #BE9EAA;

  --accent-rose: #B83E6C;
  --accent-sparkle: #E58FB0;
  --accent-teal: #0F766E; /* the ONE place teal shows up: "Plan" in the wordmark */

  --line-hairline: #F3E3EA;
  --line-chrome: #E4B7CB;

  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Be Vietnam Pro', system-ui, sans-serif;

  --nav-width: 230px;
  --nav-width-collapsed: 68px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg-canvas);
  color: var(--ink-primary);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { cursor: pointer; font-family: inherit; }

.shell { display: flex; min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--nav-width);
  flex: none;
  background: var(--bg-blush);
  border-right: 1px solid var(--line-chrome);
  display: flex;
  flex-direction: column;
  padding: 28px 20px 24px;
  position: sticky; top: 0; height: 100vh;
  transition: width 0.22s cubic-bezier(0.2,0.8,0.2,1), padding 0.22s;
}
.sidebar.collapsed { width: var(--nav-width-collapsed); padding: 28px 14px 24px; }
.sidebar.collapsed .bk-title,
.sidebar.collapsed .nav-group-title,
.sidebar.collapsed .nav-item span,
.sidebar.collapsed .help-link span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }
.sidebar.collapsed .help-link { justify-content: center; }

.brand {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line-hairline);
}
.sidebar.collapsed .brand {
  flex-direction: column;
  justify-content: center;
  gap: 12px;
}
.bk-logo {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink-primary);
}
.bk-icon-box {
  width: 36px; height: 36px; flex: none;
  border-radius: 10px;
  background: var(--bg-canvas);
  border: 1px solid var(--accent-sparkle);
  display: grid; place-items: center;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.bk-logo:hover .bk-icon-box { transform: translateY(-1px); border-color: var(--accent-rose); }
.bk-title { font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.bk-title span { color: var(--accent-teal); }

.nav-toggle {
  border: 0; background: none; color: var(--ink-muted);
  padding: 4px; display: grid; place-items: center; font-size: 18px; flex: none;
}
.nav-toggle:hover { color: var(--accent-rose); }

.nav-section { padding: 20px 0; border-bottom: 1px solid var(--line-hairline); }
.nav-section:last-of-type { border-bottom: 0; }
.nav-group-title {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-soft);
  margin: 0 0 10px 8px; white-space: nowrap;
}
.nav-list { display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px;
  text-decoration: none; color: var(--ink-muted);
  font-size: 13.5px; font-weight: 500;
  border-radius: 999px;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
}
.nav-item i { font-size: 17px; flex: none; }
.nav-item:hover { color: var(--ink-primary); background: rgba(255,255,255,0.65); }
.nav-item.active { color: var(--accent-rose); font-weight: 600; }

.sidebar-spacer { flex: 1; }

.help-link {
  display: flex; align-items: center; gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--line-hairline);
  text-decoration: none; color: var(--ink-muted);
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.help-link:hover { color: var(--accent-rose); }
.help-link i { font-size: 17px; flex: none; }

/* ===== MAIN / TOPBAR ===== */
.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  height: 58px;
  padding: 0 44px;
  border-bottom: 1px solid var(--line-chrome);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 20;
}
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-muted); }
.breadcrumb i { font-size: 13px; color: var(--ink-soft); }
.breadcrumb .curr { color: var(--ink-primary); font-weight: 600; }

.top-actions { display: flex; align-items: center; gap: 18px; }

.sem-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); }
.sem-badge i { color: var(--accent-rose); font-size: 17px; }
.sem-badge strong { color: var(--ink-primary); font-weight: 600; }

.icon-btn {
  border: 0; background: none; color: var(--ink-muted);
  padding: 6px; border-radius: 50%;
  display: grid; place-items: center; font-size: 18px;
}
.icon-btn:hover { color: var(--accent-rose); background: var(--bg-blush); }

.lang-select {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; background: none;
  font-size: 13px; color: var(--ink-muted); font-weight: 500;
}
.lang-select:hover { color: var(--accent-rose); }
.lang-select i:first-child { font-size: 16px; }
.lang-select .caret { font-size: 11px; color: var(--ink-soft); }

.account-cluster {
  display: inline-flex; align-items: center; gap: 8px;
  border: 0; background: none;
}
.account-cluster:hover .name { color: var(--accent-rose); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: var(--bg-canvas); border: 1.5px solid var(--accent-sparkle);
  color: var(--accent-rose); font-family: var(--serif); font-weight: 600; font-size: 12.5px;
  display: grid; place-items: center;
}
.account-text { line-height: 1.3; text-align: left; }
.account-text .name { font-size: 13px; font-weight: 600; color: var(--ink-primary); transition: color 0.15s; }
.account-text .email { font-size: 11.5px; color: var(--ink-muted); }
.account-cluster .caret { font-size: 11px; color: var(--ink-soft); }

.workspace-placeholder {
  flex: 1; display: grid; place-items: center;
  color: var(--ink-soft); font-size: 13px;
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <a href="#" class="bk-logo">
        <span class="bk-icon-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="3.5" y="4.5" width="17" height="16" rx="3" stroke="#3B2230" stroke-width="2"/>
            <path d="M8 2.75V6.25M16 2.75V6.25M3.5 9.5H20.5" stroke="#3B2230" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 14.5L10.75 17.25L16.25 12" stroke=var(--accent-teal) stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="bk-title">BK<span>Plan</span></span>
      </a>
      <button class="nav-toggle" id="toggleNav" title="Thu gọn thanh bên"><i class="ph ph-sidebar-simple"></i></button>
    </div>

    <nav class="nav-section">
      <div class="nav-group-title">Học tập</div>
      <div class="nav-list">
        <a href="#" class="nav-item"><i class="ph ph-chart-line-up"></i><span>Tiến độ học tập</span></a>
        <a href="#" class="nav-item active"><i class="ph ph-path"></i><span>Gợi ý lộ trình</span></a>
      </div>
    </nav>

    <nav class="nav-section">
      <div class="nav-group-title">Tài khoản</div>
      <div class="nav-list">
        <a href="#" class="nav-item"><i class="ph ph-user"></i><span>Hồ sơ cá nhân</span></a>
      </div>
    </nav>

    <div class="sidebar-spacer"></div>

    <a href="#" class="help-link"><i class="ph ph-question"></i><span>Trợ giúp</span></a>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="breadcrumb">
        <span>Học tập</span>
        <i class="ph ph-caret-right"></i>
        <span class="curr">Gợi ý lộ trình</span>
      </div>

      <div class="top-actions">
        <div class="sem-badge"><i class="ph ph-calendar"></i> Học kỳ hiện tại: <strong>HK 261</strong></div>
        <button class="icon-btn" title="Chế độ tối/sáng"><i class="ph ph-moon"></i></button>
        <button class="lang-select"><i class="ph ph-globe"></i> EN <i class="ph ph-caret-down caret"></i></button>
        <button class="account-cluster">
          <span class="avatar">AM</span>
          <span class="account-text">
            <div class="name">Alex Morgan</div>
            <div class="email">alex.morgan@university.edu</div>
          </span>
          <i class="ph ph-caret-down caret"></i>
        </button>
        <button class="icon-btn" title="Đăng xuất"><i class="ph ph-sign-out"></i></button>
      </div>
    </header>

    <div class="workspace-placeholder">Trang hiện không hiển thị được</div>
  </div>
</div>

<script>
document.getElementById('toggleNav').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});
</script>
</body>
</html>
